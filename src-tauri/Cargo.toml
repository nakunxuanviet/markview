[package]
name = "markview"
version = "2.0.0"
description = "MarkView - Markdown Editor"
authors = ["VietTX5"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["config-toml"] }

[dependencies]
ammonia = "4.0.3"
base64 = "0.23.1"
chardetng = "1.0.0"
chrono = "0.4.45"
comrak = "0.49.0"
dirs = "7.0.0"
encoding_rs = "0.8.35"
glob = "0.3.4"
notify = "8.2.0"
percent-encoding = "2.3.1"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
trash = "5.2.3"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
